<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>E-Commerce AI Support</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
}

.chat-container{
width:100%;
max-width:1100px;
height:90vh;
background:white;
border-radius:20px;
overflow:hidden;
display:flex;
box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.sidebar{
width:280px;
background:#111827;
color:white;
padding:25px;
display:flex;
flex-direction:column;
gap:20px;
}

.sidebar h2{
font-size:24px;
}

.sidebar input{
padding:12px;
border:none;
border-radius:10px;
outline:none;
}

.main{
flex:1;
display:flex;
flex-direction:column;
}

.header{
padding:20px;
border-bottom:1px solid #eee;
font-weight:bold;
font-size:20px;
background:white;
}

.chat-box{
flex:1;
overflow-y:auto;
padding:25px;
background:#f3f4f6;
display:flex;
flex-direction:column;
gap:15px;
}

.message{
max-width:75%;
padding:14px;
border-radius:15px;
line-height:1.5;
animation:fade .3s ease;
word-wrap:break-word;
}

.user{
align-self:flex-end;
background:#2563eb;
color:white;
}

.bot{
align-self:flex-start;
background:white;
}

.typing{
opacity:.6;
font-style:italic;
}

.footer{
padding:15px;
display:flex;
gap:10px;
background:white;
border-top:1px solid #eee;
}

.footer input{
flex:1;
padding:15px;
border:1px solid #ddd;
border-radius:30px;
outline:none;
}

button{
border:none;
background:#2563eb;
color:white;
padding:15px 25px;
border-radius:30px;
cursor:pointer;
}

.meta{
padding:10px 20px;
font-size:13px;
color:#555;
background:#fafafa;
border-top:1px solid #eee;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(10px)
}
to{
opacity:1;
transform:translateY(0)
}
}

@media(max-width:768px){

.chat-container{
height:100vh;
border-radius:0;
}

.sidebar{
display:none;
}

.message{
max-width:90%;
}

}

</style>

</head>

<body>

<div class="chat-container">

<div class="sidebar">

<h2>AI Support</h2>

<input id="customerId"
placeholder="Customer ID">

<input id="orderId"
placeholder="Order ID">

<div>
Examples:
<br><br>
Track order 345
<br><br>
Refund policy
<br><br>
Payment failed
</div>

</div>


<div class="main">

<div class="header">
E-Commerce Support Assistant
</div>

<div
class="chat-box"
id="chatBox">

<div class="message bot">
Hello 👋<br>
How can I help you today?
</div>

</div>

<div class="meta" id="meta">

Intent: -

</div>

<div class="footer">

<input
id="messageInput"
placeholder="Type message...">

<button onclick="sendMessage()">
Send
</button>

</div>

</div>

</div>

<script>

const chatBox=
document.getElementById(
"chatBox"
)

const input=
document.getElementById(
"messageInput"
)

let sessionId=
localStorage.getItem(
"session"
)

if(!sessionId){

sessionId=
crypto.randomUUID()

localStorage.setItem(
"session",
sessionId
)

}


function addMessage(
text,
type
){

let div=
document.createElement(
"div"
)

div.className=
`message ${type}`

div.innerHTML=text

chatBox.appendChild(div)

chatBox.scrollTop=
chatBox.scrollHeight

return div

}


async function sendMessage(){

const text=
input.value.trim()

if(!text)return


addMessage(
text,
"user"
)

input.value=""


const botDiv=
addMessage(
"",
"bot"
)


const customerId=
document.getElementById(
"customerId"
).value

const orderId=
document.getElementById(
"orderId"
).value


botDiv.innerHTML=
"<span class='typing'>Typing...</span>"


const response=
await fetch(
"http://127.0.0.1:8000/api/v1/chatbot/chat/stream",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({

message:text,
session_id:sessionId,
user_id:customerId,
order_id:orderId

})
}
)


const reader=
response.body
.getReader()

const decoder=
new TextDecoder()


botDiv.innerHTML=""


while(true){

const {done,value}
=
await reader.read()

if(done)break

const chunk=
decoder.decode(value)

const lines=
chunk.split("\n")

for(const line of lines){

if(
line.startsWith(
"data:"
)
){

try{

const data=
JSON.parse(
line.replace(
"data:",
""
)
)

if(
data.token
){

botDiv.innerHTML+=
data.token

chatBox.scrollTop=
chatBox.scrollHeight

}


if(
data.done
){

document
.getElementById(
"meta"
)
.innerHTML=
`
Intent:
${data.intent}

`

}


if(
data.error
){

botDiv.innerHTML=
"Error: "+
data.error

}

}
catch(e){}

}

}

}

}

input.addEventListener(
"keypress",
e=>{

if(
e.key==="Enter"
){

sendMessage()

}

})

</script>

</body>
</html>
